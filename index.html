<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeBSD Photo Edit</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#1c1c1c;
    color:white;
    text-align:center;
    margin:0;
    padding:20px;
}
h1{
    color:#ffcc00;
}
.toolbar{
    margin:15px;
}
button,input{
    margin:5px;
    padding:8px;
}
canvas{
    border:2px solid #555;
    background:white;
    max-width:95%;
}
</style>
</head>
<body>

<h1>FreeBSD Photo Edit</h1>

<input type="file" id="upload" accept="image/*">

<div class="toolbar">
    Brightness
    <input type="range" id="brightness" min="0" max="200" value="100">

    Contrast
    <input type="range" id="contrast" min="0" max="200" value="100">

    <button onclick="grayscale()">Grayscale</button>
    <button onclick="invert()">Invert</button>
    <button onclick="resetImage()">Reset</button>
    <button onclick="downloadImage()">Save</button>
</div>

<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById("upload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();
let originalImageData;

upload.addEventListener("change", function(e){
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = function(event){
        img.onload = function(){
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img,0,0);

            originalImageData = ctx.getImageData(
                0,0,canvas.width,canvas.height
            );
        };
        img.src = event.target.result;
    };
    reader.readAsDataURL(file);
});

function applyFilters(){
    if(!originalImageData) return;

    let temp = new ImageData(
        new Uint8ClampedArray(originalImageData.data),
        originalImageData.width,
        originalImageData.height
    );

    let data = temp.data;

    let brightness =
        parseInt(document.getElementById("brightness").value);

    let contrast =
        parseInt(document.getElementById("contrast").value);

    brightness = brightness - 100;
    contrast = contrast / 100;

    for(let i=0;i<data.length;i+=4){
        data[i] = ((data[i]-128)*contrast)+128+brightness;
        data[i+1] = ((data[i+1]-128)*contrast)+128+brightness;
        data[i+2] = ((data[i+2]-128)*contrast)+128+brightness;
    }

    ctx.putImageData(temp,0,0);
}

document.getElementById("brightness")
.addEventListener("input", applyFilters);

document.getElementById("contrast")
.addEventListener("input", applyFilters);

function grayscale(){
    const imageData =
        ctx.getImageData(0,0,canvas.width,canvas.height);

    const data = imageData.data;

    for(let i=0;i<data.length;i+=4){
        let avg=(data[i]+data[i+1]+data[i+2])/3;
        data[i]=avg;
        data[i+1]=avg;
        data[i+2]=avg;
    }

    ctx.putImageData(imageData,0,0);
}

function invert(){
    const imageData =
        ctx.getImageData(0,0,canvas.width,canvas.height);

    const data = imageData.data;

    for(let i=0;i<data.length;i+=4){
        data[i]=255-data[i];
        data[i+1]=255-data[i+1];
        data[i+2]=255-data[i+2];
    }

    ctx.putImageData(imageData,0,0);
}

function resetImage(){
    if(originalImageData){
        ctx.putImageData(originalImageData,0,0);
        document.getElementById("brightness").value=100;
        document.getElementById("contrast").value=100;
    }
}

function downloadImage(){
    const link=document.createElement("a");
    link.download="freebsd_photo_edit.png";
    link.href=canvas.toDataURL();
    link.click();
}
</script>

</body>
</html>
